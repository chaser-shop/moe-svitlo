<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моє Світло</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#eef1f3;--card:#fff;--soft:#f3f5f7;--amber:#e9b44c;--price:#a8650a;--ink:#1f2933;--muted:#5f6b76;--line:#dde3e8;--shadow:0 2px 10px rgba(31,41,51,.06)}
:root[data-theme=dark]{color-scheme:dark;--bg:#14181c;--card:#1d2328;--soft:#12161a;--amber:#d4a14a;--price:#e3b365;--ink:#e6eaee;--muted:#98a3ad;--line:#2b343b;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);padding:0 16px calc(104px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--price);outline-offset:2px}
h1{font-size:30px;font-weight:800;margin:0}
.top{display:flex;align-items:center;gap:12px;padding:20px 0 14px}
.top svg{width:40px;height:40px;flex:none}
.top small{display:block;color:var(--muted);font-size:14px;font-weight:600;margin-top:2px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:0 18px;height:52px;margin-bottom:14px}
.search input{border:0;background:none;flex:1;font:inherit;font-weight:600;min-width:0;color:var(--ink)}
.search input:focus-visible{outline:0}
.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chip{flex:none;height:44px;padding:0 18px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.chip.on{background:var(--amber);border-color:var(--amber);color:#1f2933}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;position:relative;box-shadow:var(--shadow)}
.pic{aspect-ratio:1;border-radius:16px;background:var(--soft);display:grid;place-items:center;overflow:hidden;font-size:64px;cursor:pointer}
.pic img{width:100%;height:100%;object-fit:contain}
.card h3{font-size:15px;font-weight:700;margin:10px 4px 0;line-height:1.25;min-height:38px;cursor:pointer}
.price{color:var(--price);font-weight:800;font-size:22px;margin:6px 4px 10px}
.btn{height:48px;border-radius:999px;background:var(--amber);color:#1f2933;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}
.fav{position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px;color:var(--muted);line-height:1}
.fav.on{color:#d9534f}
.hero{background:var(--amber);border-radius:26px;padding:20px;margin-bottom:18px;display:flex;align-items:center;gap:14px;color:#1f2933}
.hero img{width:92px;height:92px;border-radius:50%;flex:none}
.hero b{font-size:21px;display:block;margin-bottom:4px}
.sec-h{font-size:20px;font-weight:800;margin:6px 2px 12px}
.empty{text-align:center;padding:70px 20px 0}
.empty .ico{font-size:88px}
.empty h2{font-size:26px;font-weight:700;margin:18px 0 22px}
.empty .btn{max-width:280px;margin:0 auto}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;margin-bottom:10px}
.row .pic{width:72px;aspect-ratio:1;font-size:34px;flex:none;cursor:default}
.row .info{flex:1;min-width:0}.row .info b{font-size:14px;display:block}.row .info .price{margin:2px 0 0;font-size:17px}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border-radius:50%;background:var(--amber);color:#1f2933;font-weight:800;font-size:18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:6px 16px;margin-bottom:14px}
.menu{display:flex;align-items:center;gap:16px;width:100%;background:none;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;font-weight:700;font-size:18px}
.menu:last-child{border:0}
.menu i{font-style:normal;width:48px;height:48px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:22px}
.menu span{flex:1}.menu::after{content:"›";color:var(--price);font-size:30px}
.me{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px}
.me img{width:80px;height:80px;border-radius:50%;object-fit:cover}.me b{font-size:24px;display:block}.me span{color:var(--muted);font-weight:600}
form label.l{display:block;font-weight:700;font-size:14px;margin:14px 2px 6px}
form input:not([type=radio]),form textarea{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px 16px;font:inherit;font-weight:600}
form input:disabled{opacity:.5}
.sum{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:14px 4px}
.h2{font-size:18px;font-weight:800;margin:22px 2px 4px}
.dd{background:var(--card);border:1px solid var(--line);border-radius:14px;max-height:220px;overflow:auto;margin-top:6px}
.dd:empty{display:none}
.dd button{display:block;width:100%;text-align:left;padding:12px 14px;background:none;font-weight:600;font-size:14px;border-bottom:1px solid var(--line)}
.dd button:last-child{border:0}
.chosen{font-size:13px;color:var(--price);font-weight:700;margin:6px 4px 0}
.pay{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;cursor:pointer}
.pay:has(input:checked){border-color:var(--amber);box-shadow:0 0 0 2px var(--amber) inset}
.pay input{margin-top:3px;accent-color:var(--price);width:18px;height:18px}
.pay b{display:block}.pay small{color:var(--muted);font-weight:600;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:24px 24px 0 0;display:flex;padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;color:var(--muted);font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 8px;position:relative}
nav button .e{font-size:25px;filter:grayscale(1) opacity(.7)}
nav button.on{color:var(--price)}nav button.on .e{filter:none}
nav button.on::after{content:"";position:absolute;bottom:0;width:40px;height:4px;border-radius:4px;background:var(--amber)}
.badge{position:absolute;top:0;left:55%;background:var(--amber);color:#1f2933;border-radius:99px;font-size:11px;font-weight:800;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.back{background:none;font-weight:800;color:var(--price);font-size:16px;padding:16px 0 4px}
.st{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--soft);font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:700;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const theme = tg?.colorScheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.dataset.theme = theme;
const bgc = theme === 'dark' ? '#14181c' : '#eef1f3';
tg?.setHeaderColor?.(bgc); tg?.setBackgroundColor?.(bgc);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms) } };

const S = { tab: 'catalog', sub: null, products: [], cats: [], cat: 'all', q: '', cart: load('cart', {}), favs: load('favs', []), info: load('info', {}), orders: [], support: '', done: null, comment: '' };
const user = tg?.initDataUnsafe?.user;
const api = (url, opt = {}) => fetch(url, { ...opt, headers: { 'Content-Type': 'application/json', 'x-init-data': tg?.initData || '', ...opt.headers } }).then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Помилка'); return j });
const img = p => p.hasImage ? `<img src="/api/products/${p._id}/image?v=${new Date(p.updatedAt).getTime()}" alt="${esc(p.name)}" loading="lazy">` : (S.cats.find(c => c.id === p.category)?.icon || '💡');
const money = n => `${n} ₴`;
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 2200) };
const cartCount = () => Object.values(S.cart).reduce((a, b) => a + b, 0);
const cartItems = () => Object.entries(S.cart).map(([id, qty]) => ({ p: S.products.find(p => p._id === id), qty })).filter(i => i.p);
const STATUS = { new: 'Нове', processing: 'В обробці', shipped: 'Відправлено', done: 'Виконано', cancelled: 'Скасовано' };
const PAY = { cod: 'Накладений платіж', pending: 'Очікує оплату', paid: 'Оплачено', failed: 'Помилка оплати' };
const saveInfo = () => save('info', S.info);

/* ---------- Екрани ---------- */
const sun = `<svg viewBox="0 0 48 48" fill="none" stroke="#e9b44c" stroke-width="3.5" stroke-linecap="round"><circle cx="24" cy="24" r="8" fill="#e9b44c" fill-opacity=".25"/><path d="M24 4v5M24 39v5M4 24h5M39 24h5M9.9 9.9l3.5 3.5M34.6 34.6l3.5 3.5M9.9 38.1l3.5-3.5M34.6 13.4l3.5-3.5"/></svg>`;
const brand = `<div class="top">${sun}<div><h1>Моє Світло</h1><small>Світло завжди з тобою</small></div></div>`;

function card(p) {
  const fav = S.favs.includes(p._id);
  return `<div class="card"><button class="fav ${fav ? 'on' : ''}" data-fav="${p._id}" aria-label="В обране">${fav ? '♥' : '♡'}</button>
    <div class="pic" data-open="${p._id}">${img(p)}</div><h3 data-open="${p._id}">${esc(p.name)}</h3>
    <div class="price">${money(p.price)}</div><button class="btn" data-add="${p._id}">🛒 У кошик</button></div>`;
}
const none = '<p style="grid-column:1/-1;text-align:center;color:var(--muted)">Нічого не знайдено</p>';
const filtered = () => S.products.filter(p => (S.cat === 'all' || p.category === S.cat) && p.name.toLowerCase().includes(S.q.toLowerCase()));

function catalog() {
  const chips = [{ id: 'all', name: 'Усі' }, ...S.cats].map(c => `<button class="chip ${S.cat === c.id ? 'on' : ''}" data-cat="${c.id}">${c.icon ? c.icon + ' ' : ''}${c.name}</button>`).join('');
  return `${brand}<div class="search"><span>🔍</span><input id="q" placeholder="Пошук товарів" value="${esc(S.q)}"></div>
    <div class="chips">${chips}</div><div class="grid" id="grid">${filtered().map(card).join('') || none}</div>`;
}

function home() {
  return `${brand}<div class="hero"><img src="/logo.png" alt=""><div><b>Світло без перебоїв</b>Лампи, павербанки та безперебійники для дому й походів.</div></div>
    <div class="sec-h">Новинки</div><div class="grid">${S.products.slice(0, 4).map(card).join('')}</div>
    <button class="btn" style="margin-top:16px" data-tab="catalog">Весь каталог</button>`;
}

function cart() {
  const items = cartItems();
  if (!items.length) return `<div class="top"><h1>Кошик</h1></div><div class="empty"><div class="ico">🛒</div><h2>Кошик порожній</h2><button class="btn" data-tab="catalog">До каталогу</button></div>`;
  const total = items.reduce((s, i) => s + i.p.price * i.qty, 0);
  const I = S.info, pay = I.payment || 'cod';
  return `<div class="top"><h1>Кошик</h1></div>
    ${items.map(({ p, qty }) => `<div class="row"><div class="pic">${img(p)}</div><div class="info"><b>${esc(p.name)}</b><div class="price">${money(p.price * qty)}</div></div>
      <div class="qty"><button data-dec="${p._id}" aria-label="Менше">−</button><b>${qty}</b><button data-add="${p._id}" aria-label="Більше">+</button></div></div>`).join('')}
    <div class="sum"><span>Товари</span><span>${money(total)}</span></div>
    <form id="order" novalidate>
    <div class="h2">Отримувач</div>
    <label class="l">Імʼя та прізвище</label><input name="name" required autocomplete="name" value="${esc(I.name ?? user?.first_name ?? '')}">
    <label class="l">Телефон</label><input name="phone" type="tel" required placeholder="+380XXXXXXXXX" autocomplete="tel" value="${esc(I.phone || '')}">
    <div class="h2">Доставка Новою поштою</div>
    <label class="l">Місто</label><input id="city" autocomplete="off" placeholder="Почніть вводити назву" value="${esc(I.city || '')}">
    <div class="dd" id="cityList"></div>
    <label class="l">Відділення або поштомат</label><input id="wh" autocomplete="off" placeholder="Номер або вулиця" value="${esc(I.warehouse || '')}" ${I.cityRef ? '' : 'disabled'}>
    <div class="dd" id="whList"></div>
    ${I.warehouseRef ? `<div class="chosen">✓ ${esc(I.city)}, ${esc(I.warehouse)}</div>` : ''}
    <div class="h2">Спосіб оплати</div>
    <label class="pay"><input type="radio" name="payment" value="cod" ${pay === 'cod' ? 'checked' : ''}><span><b>Накладений платіж</b><small>Оплата на пошті під час отримання. Нова пошта бере комісію за переказ коштів.</small></span></label>
    <label class="pay"><input type="radio" name="payment" value="prepaid" ${pay === 'prepaid' ? 'checked' : ''}><span><b>Повна оплата</b><small>Сплачуєте ${money(total)} карткою одразу, доставка за тарифами Нової пошти.</small></span></label>
    <label class="l">Коментар</label><textarea name="comment" rows="2">${esc(S.comment)}</textarea>
    <div class="sum"><span>До сплати за товари</span><span style="color:var(--price)">${money(total)}</span></div>
    <button class="btn" type="submit">Оформити замовлення</button></form>`;
}

function profile() {
  const name = user ? [user.first_name, user.last_name].filter(Boolean).join(' ') : 'Гість';
  const items = [['orders', '📦', 'Мої замовлення'], ['address', '📍', 'Дані для доставки'], ['favs', '❤️', 'Обране'], ['support', '💬', 'Підтримка']];
  return `<div class="top"><h1>Профіль</h1></div>
    <div class="me"><img src="${user?.photo_url || '/logo.png'}" alt=""><div><b>${esc(name)}</b><span>Telegram-користувач</span></div></div>
    <div class="box">${items.map(([k, i, t]) => `<button class="menu" data-sub="${k}"><i>${i}</i><span>${t}</span></button>`).join('')}</div>`;
}

function subview() {
  const back = `<button class="back" data-sub="">← Назад</button>`;
  if (S.sub === 'favs') {
    const l = S.products.filter(p => S.favs.includes(p._id));
    return back + `<div class="top"><h1>Обране</h1></div>` + (l.length ? `<div class="grid">${l.map(card).join('')}</div>` : '<p style="color:var(--muted);font-weight:600">Натисніть ♡ на товарі, щоб зберегти його тут.</p>');
  }
  if (S.sub === 'address') {
    const I = S.info;
    return back + `<div class="top"><h1>Дані для доставки</h1></div><div class="box" style="padding:16px;font-weight:600;line-height:1.6">
      ${I.name ? esc(I.name) + '<br>' : ''}${I.phone ? esc(I.phone) + '<br>' : ''}${I.warehouseRef ? `📦 ${esc(I.city)}, ${esc(I.warehouse)}` : '<span style="color:var(--muted)">Дані збережуться автоматично після першого замовлення. Змінити їх можна в кошику.</span>'}</div>`;
  }
  if (S.sub === 'orders') return back + `<div class="top"><h1>Мої замовлення</h1></div>` + (S.orders.length ? S.orders.map(o => `<div class="box" style="padding:14px 16px">
    <b>№${o._id.slice(-6)}</b> <span class="st">${STATUS[o.status]}</span> <span class="st">${PAY[o.paymentStatus] || ''}</span>
    <div style="color:var(--muted);font-size:13px;margin:4px 0">${new Date(o.createdAt).toLocaleDateString('uk-UA')} · ${esc(o.address || '')}</div>
    ${o.items.map(i => `<div>${esc(i.name)} × ${i.qty}</div>`).join('')}<div class="price" style="margin:8px 0 0">${money(o.total)}</div></div>`).join('') : '<p style="color:var(--muted);font-weight:600">Замовлень поки немає.</p>');
}

function detail(p) {
  return `<button class="back" data-sub="">← Назад</button><div class="card" style="margin-top:8px"><div class="pic" style="cursor:default">${img(p)}</div>
    <h3 style="min-height:0;font-size:20px;cursor:default">${esc(p.name)}</h3><p style="margin:6px 4px;color:var(--muted);font-weight:600;line-height:1.5">${esc(p.description)}</p>
    <div class="price">${money(p.price)}</div><button class="btn" data-add="${p._id}">🛒 У кошик</button></div>`;
}

function doneScreen(r) {
  let pay = '';
  if (r.payUrl) pay = `<p style="font-weight:600;color:var(--muted)">Сплатіть ${money(r.total)} карткою, щоб ми відправили замовлення.</p><button class="btn" data-link="${esc(r.payUrl)}">Сплатити карткою</button><br>`;
  else if (r.payCard) pay = `<p style="font-weight:600;color:var(--muted)">Переведіть ${money(r.total)} на картку</p><p style="font-size:22px;font-weight:800">${esc(r.payCard)}</p><p style="font-weight:600;color:var(--muted)">У призначенні вкажіть №${r.num}. Ми підтвердимо оплату вручну.</p>`;
  else if (r.payError) pay = `<p style="font-weight:600;color:var(--muted)">Не вдалося створити платіж. Ми зв'яжемось із вами для оплати.</p>`;
  else pay = `<p style="font-weight:600;color:var(--muted)">Сума ${money(r.total)}. Оплата при отриманні на пошті.</p>`;
  return `<div class="empty"><div class="ico">✅</div><h2>Замовлення №${r.num} прийнято</h2>${pay}<br><button class="btn" data-tab="catalog" style="background:var(--card);border:1.5px solid var(--amber)">До каталогу</button></div>`;
}

/* ---------- Рендер ---------- */
function render() {
  const main = $('#app');
  const keep = document.activeElement?.id === 'q';
  if (S.sub?.startsWith('p:')) main.innerHTML = detail(S.products.find(p => p._id === S.sub.slice(2)) || {});
  else if (S.tab === 'profile' && S.sub) main.innerHTML = subview();
  else if (S.tab === 'cart' && S.done) main.innerHTML = S.done;
  else main.innerHTML = { home, catalog, cart, profile }[S.tab]();
  if (keep) { const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length) }
  const tabs = [['home', '🏠', 'Головна'], ['catalog', '🛍️', 'Каталог'], ['cart', '🛒', 'Кошик'], ['profile', '👤', 'Профіль']];
  $('#nav').innerHTML = tabs.map(([k, e, t]) => `<button class="${S.tab === k ? 'on' : ''}" data-tab="${k}"><span class="e">${e}</span>${t}${k === 'cart' && cartCount() ? `<span class="badge">${cartCount()}</span>` : ''}</button>`).join('');
}

/* ---------- Нова пошта ---------- */
const list = (id, items, kind) => { const el = $(id); if (el) el.innerHTML = items.map(i => `<button type="button" data-pick="${kind}" data-ref="${esc(i.ref)}" data-name="${esc(i.name)}">${esc(i.name)}</button>`).join('') };
const findCities = debounce(async q => { try { list('#cityList', await api('/api/np/cities?q=' + encodeURIComponent(q)), 'city') } catch (e) { toast(e.message) } }, 300);
const findWh = debounce(async q => { try { list('#whList', await api(`/api/np/warehouses?cityRef=${encodeURIComponent(S.info.cityRef)}&q=${encodeURIComponent(q)}`), 'wh') } catch (e) { toast(e.message) } }, 300);

/* ---------- Події ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button,[data-open]'); if (!t) return;
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab; S.sub = null; S.done = null; window.scrollTo(0, 0) }
  else if (d.cat) S.cat = d.cat;
  else if (d.add) { S.cart[d.add] = (S.cart[d.add] || 0) + 1; save('cart', S.cart); tg?.HapticFeedback?.impactOccurred('light'); if (S.tab !== 'cart') toast('Додано в кошик') }
  else if (d.dec) { if (--S.cart[d.dec] <= 0) delete S.cart[d.dec]; save('cart', S.cart) }
  else if (d.fav) { const i = S.favs.indexOf(d.fav); i < 0 ? S.favs.push(d.fav) : S.favs.splice(i, 1); save('favs', S.favs) }
  else if (d.open) { S.sub = 'p:' + d.open; window.scrollTo(0, 0) }
  else if (d.link) { tg ? tg.openLink(d.link) : open(d.link, '_blank'); return }
  else if (d.pick === 'city') { Object.assign(S.info, { city: d.name, cityRef: d.ref, warehouse: '', warehouseRef: '' }); saveInfo(); render(); $('#wh').focus(); findWh(''); return }
  else if (d.pick === 'wh') { Object.assign(S.info, { warehouse: d.name, warehouseRef: d.ref }); saveInfo() }
  else if (d.sub !== undefined) {
    S.sub = d.sub || null;
    if (d.sub === 'support') { S.sub = null; const u = S.support.replace('@', ''); return u ? (tg ? tg.openTelegramLink(`https://t.me/${u}`) : open(`https://t.me/${u}`)) : toast('Підтримка скоро зʼявиться') }
    if (d.sub === 'orders') { S.orders = await api('/api/orders/my').catch(() => []) }
  } else return;
  render();
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { S.q = el.value; $('#grid').innerHTML = filtered().map(card).join('') || none }
  else if (el.id === 'city') { Object.assign(S.info, { city: el.value, cityRef: '', warehouse: '', warehouseRef: '' }); saveInfo(); const w = $('#wh'); w.disabled = true; w.value = ''; $('#whList').innerHTML = ''; findCities(el.value) }
  else if (el.id === 'wh') { Object.assign(S.info, { warehouse: el.value, warehouseRef: '' }); saveInfo(); findWh(el.value) }
  else if (el.closest('#order')) {
    if (['name', 'phone'].includes(el.name)) S.info[el.name] = el.value;
    else if (el.name === 'payment') S.info.payment = el.value;
    else if (el.name === 'comment') S.comment = el.value;
    saveInfo();
  }
});
document.addEventListener('focusin', e => { if (e.target.id === 'wh' && S.info.cityRef && !$('#whList').innerHTML) findWh(e.target.value) });

document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id !== 'order') return;
  const f = Object.fromEntries(new FormData(e.target)), I = S.info;
  if (!I.cityRef || !I.warehouseRef) return toast('Оберіть місто та відділення зі списку');
  const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
  try {
    const r = await api('/api/orders', { method: 'POST', body: JSON.stringify({
      name: f.name, phone: f.phone, comment: f.comment, payment: f.payment || 'cod',
      city: I.city, cityRef: I.cityRef, warehouse: I.warehouse, warehouseRef: I.warehouseRef,
      items: Object.entries(S.cart).map(([id, qty]) => ({ id, qty })) }) });
    S.cart = {}; save('cart', S.cart); S.comment = ''; S.done = doneScreen(r);
    tg?.HapticFeedback?.notificationOccurred('success');
    render(); window.scrollTo(0, 0);
    if (r.payUrl) tg ? tg.openLink(r.payUrl) : open(r.payUrl, '_blank');
  } catch (err) { toast(err.message); btn.disabled = false }
});

/* ---------- Старт ---------- */
(async () => {
  try {
    const [cfg, products] = await Promise.all([api('/api/config'), api('/api/products')]);
    S.cats = cfg.categories; S.support = cfg.support; S.products = products;
    S.cart = Object.fromEntries(Object.entries(S.cart).filter(([id]) => products.some(p => p._id === id)));
  } catch { toast('Не вдалося завантажити товари') }
  render();
})();
</script>
</body>
</html>
