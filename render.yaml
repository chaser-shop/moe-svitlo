services:
  - type: web
    name: moe-svitlo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: NOVA_POSHTA_API_KEY
        sync: false
      - key: MONO_TOKEN
        sync: false
      - key: PAYMENT_CARD
        sync: false
